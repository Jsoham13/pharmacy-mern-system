version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: pharmacy_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: pharmacy_store
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: pharmacy_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/pharmacy_store
      JWT_SECRET: super_secure_jwt_pharmacy_production_secret_2026
      JWT_EXPIRES_IN: 7d
      CLIENT_ORIGIN: http://localhost
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: pharmacy_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
